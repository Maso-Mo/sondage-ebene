<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title">
  <title id="title">Bouquet de roses ouvertes et tulipes</title>
  <defs>
    <radialGradient id="b-rose" cx="38%" cy="30%" r="78%">
      <stop stop-color="#fff3f4"/><stop offset=".52" stop-color="#edb5c2"/><stop offset="1" stop-color="#c56d8a"/>
    </radialGradient>
    <linearGradient id="b-tulip" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffecef"/><stop offset="1" stop-color="#c86e8b"/>
    </linearGradient>
    <linearGradient id="b-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#cad4bd"/><stop offset="1" stop-color="#75866b"/>
    </linearGradient>
    <filter id="b-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#753b50" flood-opacity=".12"/>
    </filter>
  </defs>

  <g fill="none" stroke="#7c8c71" stroke-width="5" stroke-linecap="round">
    <path d="M405 422c11-116 12-211-3-303M410 421c-63-113-125-193-207-284M418 422c74-123 144-220 229-302M407 421c-18-93-70-157-146-205M416 421c41-88 94-145 157-184"/>
  </g>
  <g fill="url(#b-leaf)">
    <path d="M380 355c-75-48-137-29-172 29 69 43 128 32 172-29ZM433 354c70-53 132-39 172 15-64 48-123 43-172-15Z"/>
    <path d="M326 285c-58-43-110-30-139 17 54 39 104 34 139-17ZM480 284c55-47 108-37 141 8-51 43-100 42-141-8Z"/>
    <path d="M253 221c-50-31-91-18-110 21 47 27 86 20 110-21ZM552 223c46-37 90-29 117 8-42 33-83 31-117-8Z"/>
  </g>

  <!-- Tulipes fermées et semi-ouvertes -->
  <g transform="translate(194 126) rotate(-12)">
    <path d="M0 66C-42 65-67 38-61-5c4-28 25-52 61-70 35 19 55 44 59 71 6 42-19 69-59 70Z" fill="url(#b-tulip)"/>
    <path d="M0 65C-16 34-16-8 0-75 17-11 17 33 0 65Z" fill="#a94e6c" opacity=".65"/>
  </g>
  <g transform="translate(650 111) rotate(14)">
    <path d="M0 59C-37 58-60 34-55-5c3-25 22-47 55-63 31 17 50 40 53 64 5 38-17 62-53 63Z" fill="url(#b-tulip)"/>
    <path d="M0 58C-14 30-14-8 0-68 15-9 15 30 0 58Z" fill="#ae526f" opacity=".62"/>
  </g>

  <!-- Roses ouvertes, toutes vues de face -->
  <g filter="url(#b-shadow)" transform="translate(407 142)">
    <g fill="url(#b-rose)">
      <ellipse rx="47" ry="82" transform="rotate(0) translate(0 -43)"/><ellipse rx="47" ry="82" transform="rotate(45) translate(0 -43)"/>
      <ellipse rx="47" ry="82" transform="rotate(90) translate(0 -43)"/><ellipse rx="47" ry="82" transform="rotate(135) translate(0 -43)"/>
      <ellipse rx="47" ry="82" transform="rotate(180) translate(0 -43)"/><ellipse rx="47" ry="82" transform="rotate(225) translate(0 -43)"/>
      <ellipse rx="47" ry="82" transform="rotate(270) translate(0 -43)"/><ellipse rx="47" ry="82" transform="rotate(315) translate(0 -43)"/>
    </g>
    <circle r="71" fill="#d9809b" opacity=".58"/><circle r="48" fill="#c06482"/><path d="M-25 5C-14-29 15-34 29-11 43 12 23 37-2 35-20 34-31 20-25 5Z" fill="#91445f"/><circle r="13" fill="#632b41"/>
  </g>
  <g filter="url(#b-shadow)" transform="translate(287 237) scale(.76)">
    <g fill="url(#b-rose)">
      <ellipse rx="47" ry="82" transform="rotate(0) translate(0 -43)"/><ellipse rx="47" ry="82" transform="rotate(60) translate(0 -43)"/><ellipse rx="47" ry="82" transform="rotate(120) translate(0 -43)"/><ellipse rx="47" ry="82" transform="rotate(180) translate(0 -43)"/><ellipse rx="47" ry="82" transform="rotate(240) translate(0 -43)"/><ellipse rx="47" ry="82" transform="rotate(300) translate(0 -43)"/>
    </g>
